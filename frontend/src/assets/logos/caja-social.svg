<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 60" fill="none">
  <rect width="140" height="60" fill="white"/>
  <!-- Símbolo circular con puntos (flor) -->
  <g transform="translate(18, 30)">
    <!-- Centro -->
    <circle cx="0" cy="0" r="2" fill="#003A70"/>
    <!-- Pétalos externos (azul y rojo alternados) -->
    <circle cx="0" cy="-8" r="2.3" fill="#003A70"/>
    <circle cx="5.7" cy="-5.7" r="2.3" fill="#E30613"/>
    <circle cx="8" cy="0" r="2.3" fill="#003A70"/>
    <circle cx="5.7" cy="5.7" r="2.3" fill="#E30613"/>
    <circle cx="0" cy="8" r="2.3" fill="#003A70"/>
    <circle cx="-5.7" cy="5.7" r="2.3" fill="#E30613"/>
    <circle cx="-8" cy="0" r="2.3" fill="#003A70"/>
    <circle cx="-5.7" cy="-5.7" r="2.3" fill="#E30613"/>
  </g>
  <!-- Texto -->
  <text x="35" y="23" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#003A70">Banco</text>
  <text x="35" y="36" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#003A70">Caja Social</text>
  <line x1="35" y1="38" x2="105" y2="38" stroke="#4A9FD8" stroke-width="1"/>
  <text x="35" y="46" font-family="Arial, sans-serif" font-size="7" fill="#4A9FD8">Su banco amigo.</text>
</svg>
