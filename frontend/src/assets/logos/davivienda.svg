<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <rect width="200" height="60" fill="white"/>
  
  <!-- Casa característica de Davivienda -->
  <g transform="translate(10, 10)">
    <!-- Casa naranja -->
    <path d="M 0 20 L 20 0 L 40 20 L 40 40 L 0 40 Z" fill="#FF6B35"/>
    <!-- Techo rojo -->
    <path d="M 0 20 L 20 0 L 40 20 L 35 20 L 20 5 L 5 20 Z" fill="#E63946"/>
    <!-- Puerta amarilla -->
    <rect x="14" y="26" width="12" height="14" fill="#FFD60A"/>
    <!-- Ventanas azules -->
    <rect x="6" y="24" width="6" height="6" fill="#457B9D"/>
    <rect x="28" y="24" width="6" height="6" fill="#457B9D"/>
  </g>
  
  <!-- Texto DAVIVIENDA en rojo -->
  <text x="58" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#E63946">DAVIVIENDA</text>
</svg>
