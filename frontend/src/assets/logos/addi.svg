<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 60" fill="none">
  <rect width="140" height="60" fill="white"/>
  <g transform="translate(15, 30)">
    <!-- Color azul de Addi -->
    <defs>
      <style>
        .addi-blue { fill: #3B6EB6; }
      </style>
    </defs>
    
    <!-- Letra A (arco con hueco) -->
    <path class="addi-blue" d="M 0,8 Q 0,-5 10,-5 Q 20,-5 20,8 L 20,18 L 14,18 L 14,8 Q 14,1 10,1 Q 6,1 6,8 L 6,18 L 0,18 Z M 6,8 L 6,12 L 14,12 L 14,8 Z"/>
    
    <!-- Letra d (primera) - línea vertical + círculo -->
    <circle class="addi-blue" cx="35" cy="8" r="10"/>
    <circle fill="white" cx="35" cy="8" r="5"/>
    <rect class="addi-blue" x="40" y="-10" width="6" height="28"/>
    
    <!-- Letra d (segunda) - línea vertical + círculo -->
    <circle class="addi-blue" cx="61" cy="8" r="10"/>
    <circle fill="white" cx="61" cy="8" r="5"/>
    <rect class="addi-blue" x="66" y="-10" width="6" height="28"/>
    
    <!-- Letra i - línea vertical + punto -->
    <rect class="addi-blue" x="82" y="0" width="6" height="18"/>
    <circle class="addi-blue" cx="85" cy="-6" r="4"/>
  </g>
</svg>
